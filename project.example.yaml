# laya-assist-proxy -- Projekteinstellungen
#
# Nach project.yaml kopieren, oder einfach die Oberflaeche benutzen: sie schreibt
# diese Datei bei jeder Aenderung. Der Home-Assistant-Token steht bewusst nicht
# hier, sondern in secrets.local.json (nur wenn "Token speichern" gesetzt ist).

server:
  host: 0.0.0.0
  port: 7788
  device: null          # null = automatisch (mps, cuda, sonst cpu)
  preload: true         # Checkpoint beim Start laden, nicht bei der ersten Anfrage

model:
  default: multilingual
  threshold: 0.6        # darunter uebernimmt die Rueckfallebene

fallback:
  enabled: false
  # Jeder OpenAI-kompatible Endpunkt: Ollama http://localhost:11434,
  # Lemonade http://localhost:8000/api/v1. /v1 wird angehaengt, wenn es fehlt.
  url: http://localhost:11434
  model: ''             # z. B. qwen3:8b -- Auswahl per "Modelle laden"
  timeout: 120.0
  # Ein API-Key, falls der Endpunkt einen braucht, steht NICHT hier, sondern in
  # secrets.local.json unter "fb_api_key" (die Oberflaeche schreibt ihn dorthin).

context:
  entries: 2            # fruehere Aeusserungen an laya; 0 = aus, Maximum 8

homeassistant:
  url: ''               # z. B. http://homeassistant.local:8123
  save_token: false

catalog:                # wird von "Katalog laden" gefuellt
  areas: {}
  entities: {}
