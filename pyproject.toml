[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-assist-proxy"
version = "0.1.0"
description = "Local-first Home Assistant conversation agent: decides voice commands with laya, falls back to an LLM"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Daniel Wyschka" }]
keywords = ["home-assistant", "voice-assistant", "laya", "intent", "conversation-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
]
dependencies = [
    "laya>=0.3.4",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/dwyschka/laya-assist-proxy"
Issues = "https://github.com/dwyschka/laya-assist-proxy/issues"
"Upstream model" = "https://github.com/NandhaKishorM/laya"

[project.scripts]
laya-assist = "laya_assist.server:main"

[tool.setuptools.packages.find]
include = ["laya_assist*"]

[tool.setuptools.package-data]
laya_assist = ["static/*"]
